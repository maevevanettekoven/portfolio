<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Vinyl record. Four concentric circles via evenodd fill rule:
    r=47 outer disc → r=30 start transparent groove ring → r=20 end groove ring
    → r=6 transparent spindle hole. Odd-count regions = dark green, even = transparent.
  -->
  <path
    fill-rule="evenodd"
    fill="#1c3c35"
    d="M3,50 A47,47 0 1,1 97,50 A47,47 0 1,1 3,50Z
       M20,50 A30,30 0 1,1 80,50 A30,30 0 1,1 20,50Z
       M30,50 A20,20 0 1,1 70,50 A20,20 0 1,1 30,50Z
       M44,50 A6,6 0 1,1 56,50 A6,6 0 1,1 44,50Z"
  />
</svg>
